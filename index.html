<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrovision AR — Programa Beta</title>
<meta name="description" content="Inscreva-se pro teste fechado do Astrovision AR, um aplicativo da Chrome Hypercube.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<meta property="og:type" content="website">
<meta property="og:url" content="https://geandreotti.github.io/astrovision-beta/">
<meta property="og:title" content="Astrovision AR — Programa Beta">
<meta property="og:description" content="Ajude a testar o Astrovision AR antes do lançamento. Um aplicativo da Chrome Hypercube.">
<meta property="og:image" content="https://geandreotti.github.io/astrovision-beta/screenshots/banner-pt.jpg">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Astrovision AR — Programa Beta">
<meta name="twitter:description" content="Ajude a testar o Astrovision AR antes do lançamento.">
<meta name="twitter:image" content="https://geandreotti.github.io/astrovision-beta/screenshots/banner-pt.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://accounts.google.com/gsi/client"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#070a13;
  --panel:rgba(18,24,38,0.72);
  --panel-border:rgba(112,214,224,0.28);
  --text:#eaf3f7;
  --text-soft:#93a7b8;
  --cyan:#52e3e8;
  --cyan-dim:rgba(82,227,232,0.15);
  --warm:#ff9a4d;
  --success:#7be08a;
  --danger:#ff8a7a;
  --field-bg:rgba(255,255,255,0.04);
  --field-border:rgba(147,167,184,0.28);
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  position:relative;
  overflow-x:hidden;
  font-family:'Manrope', system-ui, sans-serif;
}
img{max-width:100%;}
.stars{
  position:fixed; inset:-20% -20% -20% -20%; z-index:0; pointer-events:none;
  background-repeat:repeat;
  opacity:.7;
}
.stars-far{
  background-image:
    radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 33% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 65% 15%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 30% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 95% 85%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 48% 92%, rgba(255,255,255,.45), transparent);
  background-size:420px 420px;
  animation:drift-far 90s linear infinite;
}
.stars-mid{
  background-image:
    radial-gradient(1.3px 1.3px at 15% 45%, rgba(255,255,255,.75), transparent),
    radial-gradient(1.2px 1.2px at 38% 18%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.3px 1.3px at 58% 70%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.2px 1.2px at 78% 32%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.3px 1.3px at 92% 78%, rgba(255,255,255,.65), transparent),
    radial-gradient(1.2px 1.2px at 25% 88%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.3px 1.3px at 68% 5%, rgba(255,255,255,.6), transparent);
  background-size:380px 380px;
  animation:drift-mid 55s linear infinite;
}
.stars-near{
  background-image:
    radial-gradient(1.8px 1.8px at 12% 22%, rgba(255,255,255,.95), transparent),
    radial-gradient(1.5px 1.5px at 72% 8%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.8px 1.8px at 88% 68%, rgba(255,255,255,.9), transparent),
    radial-gradient(1.5px 1.5px at 45% 82%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.8px 1.8px at 5% 55%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.5px 1.5px at 60% 35%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.6px 1.6px at 30% 60%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.5px 1.5px at 82% 20%, rgba(255,255,255,.75), transparent);
  background-size:320px 320px;
  animation:drift-near 32s linear infinite, twinkle 4.5s ease-in-out infinite;
}
@keyframes drift-far{ from{transform:translate3d(0,0,0);} to{transform:translate3d(-420px,420px,0);} }
@keyframes drift-mid{ from{transform:translate3d(0,0,0);} to{transform:translate3d(380px,-380px,0);} }
@keyframes drift-near{ from{transform:translate3d(0,0,0);} to{transform:translate3d(-320px,-320px,0);} }
@keyframes twinkle{ 0%,100%{opacity:.85;} 50%{opacity:.45;} }
.shooting-star{
  position:fixed; z-index:0; pointer-events:none;
  width:140px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9) 70%, #fff);
  opacity:0;
  transform:translate3d(0,0,0) rotate(45deg);
  animation:shoot 6s cubic-bezier(.2,.6,.3,1) infinite;
}
.shooting-star.s2{ animation-delay:2.1s; animation-duration:7.5s; }
.shooting-star.s3{ animation-delay:4.4s; animation-duration:5.2s; }
@keyframes shoot{
  0%{ transform:translate3d(-15vmin,-15vmin,0) rotate(45deg); opacity:0; }
  4%{ opacity:1; }
  22%{ transform:translate3d(75vmin,75vmin,0) rotate(45deg); opacity:0; }
  100%{ transform:translate3d(75vmin,75vmin,0) rotate(45deg); opacity:0; }
}
@media (prefers-reduced-motion: reduce){
  .stars-far, .stars-mid, .stars-near, .shooting-star{animation:none; opacity:0;}
}
.nebula{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(600px 420px at 12% -8%, rgba(82,227,232,0.16), transparent 60%),
    radial-gradient(560px 460px at 105% 15%, rgba(255,154,77,0.13), transparent 60%),
    radial-gradient(700px 500px at 50% 115%, rgba(82,227,232,0.10), transparent 60%);
}
.page{
  position:relative; z-index:1;
  max-width:720px;
  margin:0 auto;
  padding:52px 20px 64px;
}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:22px;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--cyan);
  display:flex; align-items:center; gap:8px;
}
.eyebrow .dot{
  width:6px; height:6px; border-radius:50%; background:var(--cyan);
  box-shadow:0 0 8px 1px var(--cyan);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.4;} 50%{opacity:1;} }
@media (prefers-reduced-motion: reduce){ .eyebrow .dot{animation:none;} }
.lang-toggle{
  flex-shrink:0;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; font-weight:600; letter-spacing:.04em;
  color:var(--cyan);
  background:var(--cyan-dim);
  border:1px solid var(--panel-border);
  border-radius:99px;
  padding:5px 11px;
  cursor:pointer;
}

html{ scroll-snap-type:y proximity; scroll-behavior:smooth; }
.snap-section{
  scroll-snap-align:start;
  min-height:100svh;
  display:flex; flex-direction:column; justify-content:center;
  align-items:center;
  position:relative;
  padding:64px 0;
}
.hero-page .top-row{ position:absolute; top:0; left:0; right:0; }
.scroll-hint{
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  color:var(--cyan); font-size:22px; text-decoration:none;
  opacity:.7;
  animation:bob 2.2s ease-in-out infinite;
}
@keyframes bob{ 0%,100%{transform:translate(-50%,0);} 50%{transform:translate(-50%,8px);} }
@media (prefers-reduced-motion: reduce){ .scroll-hint{animation:none;} html{scroll-snap-type:none; scroll-behavior:auto;} }
.hero{ text-align:center; width:100%; }
.hero h1{
  font-family:'Rajdhani', system-ui, sans-serif;
  font-weight:700;
  font-size:clamp(30px,7vw,44px);
  letter-spacing:.01em;
  line-height:1.08;
  margin:0 0 14px;
  text-wrap:balance;
}
.hero h1 .accent{color:var(--cyan);}
.gradient-rule{
  height:2px; width:64px; border-radius:2px; margin:0 auto 20px;
  background:linear-gradient(90deg, var(--cyan), var(--warm));
}
.pitch{
  font-size:15.5px; line-height:1.65; color:var(--text-soft);
  margin:0 auto 28px;
  max-width:480px;
}
.hero-cta{
  display:inline-block;
  font-family:'Rajdhani', sans-serif;
  font-weight:700; font-size:17px; letter-spacing:.03em;
  text-transform:uppercase;
  color:#05171a; text-decoration:none;
  background:linear-gradient(90deg, var(--cyan), #8ff0f3);
  border-radius:11px;
  padding:15px 34px;
  box-shadow:0 10px 30px -10px rgba(82,227,232,0.6);
}
.hero-cta:active{transform:translateY(1px);}

.section-title{
  font-family:'Rajdhani', sans-serif; font-weight:700;
  font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-soft);
  text-align:center;
  margin:0 0 30px;
  width:100%;
}
.banner{
  width:100%; border-radius:14px;
  border:1px solid var(--panel-border);
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  margin-bottom:20px;
}
.about-copy{
  font-size:14.5px; line-height:1.7; color:var(--text-soft);
  text-align:center; max-width:560px;
  margin:0 auto 32px;
}
.features{ display:flex; flex-direction:column; gap:20px; width:100%; }
.feature{
  display:grid; grid-template-columns:56px 1fr; gap:18px; align-items:center;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:16px;
  padding:16px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.feature-icon{
  width:56px; height:56px;
  display:flex; align-items:center; justify-content:center;
  color:var(--cyan);
  filter:drop-shadow(0 0 6px rgba(82,227,232,0.7));
}
.feature-icon svg{ width:38px; height:38px; }
.lightbox{
  position:fixed; inset:0; z-index:20;
  background:rgba(4,6,12,0.88);
  display:flex; align-items:center; justify-content:center;
  padding:32px 16px;
  cursor:zoom-out;
  backdrop-filter:blur(4px);
}
.lightbox img{
  max-width:100%; max-height:100%;
  border-radius:14px;
  border:1px solid var(--panel-border);
  box-shadow:0 30px 80px -20px rgba(0,0,0,0.8);
  cursor:default;
}
.lightbox-close{
  position:fixed; top:18px; right:18px; z-index:21;
  width:38px; height:38px; border-radius:50%;
  background:var(--panel); border:1px solid var(--panel-border);
  color:var(--text); font-size:20px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.feature h3{
  font-family:'Rajdhani', sans-serif; font-weight:700; font-size:19px;
  margin:0 0 6px; color:var(--text);
}
.feature p{ font-size:13.5px; line-height:1.55; color:var(--text-soft); margin:0; }
@media (max-width:400px){
  .feature{ grid-template-columns:44px 1fr; gap:12px; }
  .feature-icon{ width:44px; height:44px; }
  .feature-icon svg{ width:30px; height:30px; }
}

.form-section{ display:flex; flex-direction:column; align-items:center; }
.card{
  width:100%; max-width:440px;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:18px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(82,227,232,0.05), 0 30px 80px -30px rgba(0,0,0,0.6), 0 0 60px -20px rgba(82,227,232,0.15);
  padding:30px 26px 26px;
  position:relative;
  scroll-margin-top:24px;
}
.corner-tl, .corner-tr, .corner-bl, .corner-br{
  content:""; position:absolute; width:16px; height:16px;
  border-color:var(--cyan); opacity:.65;
}
.corner-tl{top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; border-top-left-radius:8px;}
.corner-tr{top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; border-top-right-radius:8px;}
.corner-bl{bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; border-bottom-left-radius:8px;}
.corner-br{bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; border-bottom-right-radius:8px;}
.card .eyebrow{justify-content:center; margin-bottom:10px;}
.android-note{
  text-align:center; font-size:11.5px; color:var(--warm);
  background:rgba(255,154,77,0.1); border:1px solid rgba(255,154,77,0.25);
  border-radius:8px; padding:7px 12px;
  margin:0 0 18px;
}
.field{margin-bottom:14px;}
.field label{
  display:block; font-size:11.5px; font-weight:600;
  letter-spacing:.03em; text-transform:uppercase;
  color:var(--text-soft); margin-bottom:6px;
}
.field .opt{font-weight:400; text-transform:none; letter-spacing:0; font-size:11px; opacity:.7;}
.field input, .field select{
  width:100%;
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  color:var(--text);
  background:var(--field-bg);
  border:1px solid var(--field-border);
  border-radius:9px;
  padding:11px 12px;
}
.field select{ appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2393a7b8'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%2393a7b8' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center; padding-right:32px;
}
.field select option{ color:#0e1720; }
#google-signin-btn{ display:flex; justify-content:center; width:100%; overflow:hidden; }
#google-signin-btn > div{ max-width:100%; border-radius:999px; overflow:hidden; background:#131314; }
#google-signin-btn iframe{ border:none !important; outline:none !important; }
.google-verified{
  display:flex; align-items:center; gap:8px;
  background:rgba(123,224,138,0.1); border:1px solid rgba(123,224,138,0.35);
  border-radius:9px; padding:10px 12px;
  font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--text);
}
.google-verified .check-icon{ color:var(--success); font-weight:700; flex-shrink:0; }
.google-verified span#google-email-display{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.google-verified button{
  flex-shrink:0; background:none; border:none; color:var(--text-soft);
  font-family:'Manrope', sans-serif; font-size:11.5px; text-decoration:underline;
  cursor:pointer; padding:2px;
}
.field input::placeholder{color:var(--text-soft); opacity:.7; font-family:'Manrope',sans-serif;}
.field input[readonly]{
  background:rgba(123,224,138,0.07); border-color:rgba(123,224,138,0.3);
  color:var(--text-soft); cursor:default;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim);}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.submit-btn{
  width:100%; margin-top:6px;
  font-family:'Rajdhani', sans-serif;
  font-weight:700; font-size:16px; letter-spacing:.03em;
  text-transform:uppercase;
  color:#05171a;
  background:linear-gradient(90deg, var(--cyan), #8ff0f3);
  border:none; border-radius:10px;
  padding:13px 16px;
  cursor:pointer;
  box-shadow:0 8px 24px -10px rgba(82,227,232,0.55);
}
.submit-btn:disabled{opacity:.55; cursor:default;}
.submit-btn:active:not(:disabled){transform:translateY(1px);}
.error-msg{font-size:12.5px; color:var(--danger); margin-top:10px; min-height:1em;}
.foot-row{
  margin-top:18px; padding-top:16px;
  border-top:1px solid var(--panel-border);
  text-align:center;
}
.foot-note{font-size:11.5px; color:var(--text-soft); line-height:1.5;}
.credit{
  margin-top:16px;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px; letter-spacing:.03em;
  color:var(--text-soft); opacity:.6;
  text-align:center;
}
.success{text-align:center; padding:18px 4px 6px;}
.success .ring{
  width:56px; height:56px; margin:0 auto 16px;
  border-radius:50%;
  border:2px solid var(--success);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 24px -4px var(--success);
}
.success .ring svg{width:24px;height:24px;stroke:var(--success);}
.success h2{font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px; margin:0 0 8px;}
.success p{font-size:13.5px; color:var(--text-soft); line-height:1.6; margin:0 0 4px;}
.success-email{
  display:inline-block; margin:10px auto 0 !important;
  font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--success) !important;
  background:rgba(123,224,138,0.1); border:1px solid rgba(123,224,138,0.3);
  border-radius:8px; padding:6px 14px;
  max-width:100%; overflow-wrap:break-word;
}
.countdown-box{
  margin-top:20px; padding:20px 16px;
  background:radial-gradient(120% 140% at 50% -10%, rgba(82,227,232,0.10), transparent 60%), var(--field-bg);
  border:1px solid var(--panel-border);
  border-radius:14px;
}
.countdown-label{
  font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-soft); margin:0;
}
.countdown-date{
  font-family:'Rajdhani', sans-serif; font-weight:700;
  font-size:17px; letter-spacing:.02em; text-transform:uppercase;
  color:var(--cyan);
  margin:2px 0 16px;
}
.countdown-timer{
  display:flex; justify-content:center; align-items:flex-start; gap:4px;
}
.cd-unit{ display:flex; flex-direction:column; align-items:center; min-width:38px; }
.cd-num{
  font-family:'IBM Plex Mono', monospace;
  font-size:28px; font-weight:600; line-height:1;
  color:var(--text);
  text-shadow:0 0 14px rgba(82,227,232,0.65);
  font-variant-numeric:tabular-nums;
}
.cd-unit-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:9px; letter-spacing:.1em; color:var(--text-soft);
  margin-top:6px;
}
.cd-sep{
  font-family:'IBM Plex Mono', monospace;
  font-size:20px; font-weight:600; color:var(--cyan);
  opacity:.55; line-height:1; padding-top:2px;
}
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="stars stars-far"></div>
<div class="stars stars-mid"></div>
<div class="stars stars-near"></div>
<div class="shooting-star" style="top:8%; left:5%;"></div>
<div class="shooting-star s2" style="top:22%; left:40%;"></div>
<div class="shooting-star s3" style="top:2%; left:65%;"></div>
<div class="nebula"></div>

<div class="page">

  <section class="snap-section hero-page">
    <div class="top-row">
      <div class="eyebrow"><span class="dot"></span><span data-i18n="eyebrow"></span></div>
      <button type="button" class="lang-toggle" id="lang-toggle">EN</button>
    </div>
    <div class="hero">
      <h1><span data-i18n="h1a"></span><span class="accent">Astrovision AR</span><span data-i18n="h1b"></span></h1>
      <div class="gradient-rule"></div>
      <p class="pitch" data-i18n="pitch"></p>
      <a class="hero-cta" href="#features" data-i18n="heroCtaLearnMore"></a>
    </div>
    <a class="scroll-hint" href="#features" aria-label="Scroll">&darr;</a>
  </section>

  <section class="snap-section" id="features">
    <p class="section-title" data-i18n="featuresTitle"></p>
    <img class="banner" id="banner-img" src="screenshots/banner-pt.jpg" alt="Astrovision AR — Explore o universo em 3D" loading="lazy">
    <p class="about-copy" data-i18n="aboutCopy"></p>
    <div class="features">
      <div class="feature">
        <span class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="24" cy="24" r="13"/>
            <path d="M24 11c-4 3.5-4 18.5 0 22" stroke-width="1.4"/>
            <path d="M24 11c4 3.5 4 18.5 0 22" stroke-width="1.4"/>
            <path d="M11.5 21.5h25" stroke-width="1.4"/>
            <ellipse cx="24" cy="24" rx="20" ry="7.5" transform="rotate(-20 24 24)"/>
            <circle cx="41" cy="10" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="6" cy="36" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <div><h3 data-i18n="feature1Title"></h3><p data-i18n="feature1Desc"></p></div>
      </div>
      <div class="feature">
        <span class="feature-icon" aria-hidden="true">

<script>
(function(){
  var BRANDS = ["Samsung","Xiaomi, Redmi ou POCO","Motorola","Google Pixel","Asus","Realme","OnePlus","Multilaser","LG","Sony","Nokia","TCL","Lenovo","Infinix"];
  var ANDROID_VERSIONS = ["Android 16","Android 15","Android 14","Android 13","Android 12","Android 11","Android 10","Android 9","Android 8","Android 7"];

  var STRINGS = {
    pt: {
      eyebrow: 'ASTROVISION AR · PROGRAMA BETA',
      h1a: 'Ajude a testar o ', h1b: ' antes do lançamento',
      pitch: 'Estamos recrutando um grupo pequeno pra o teste fechado no Google Play. Você tem acesso ao aplicativo antes de todo mundo, e a gente ganha seu olhar de fora pra polir antes do lançamento.',
      heroCtaLearnMore: 'Saber mais',
      heroCta: 'Quero testar',
      featuresTitle: 'Sobre o Astrovision AR',
      aboutCopy: 'Astrovision AR é um app de exploração espacial: gire e inspecione planetas, luas, estrelas, galáxias e buracos negros em 3D e realidade aumentada, com dados astronômicos reais. Compare corpos celestes lado a lado e mergulhe na Biblioteca Astronômica pra aprender mais sobre cada um.',
      feature1Title: 'Inspecione em 3D',
      feature1Desc: 'Gire, dê zoom e veja dados reais — temperatura, diâmetro, composição atmosférica — pra cada planeta, lua, estrela e galáxia.',
      feature2Title: 'Biblioteca Astronômica',
      feature2Desc: 'Textos completos e curados sobre cada corpo celeste, do nosso Sistema Solar até galáxias distantes.',
      feature3Title: 'Compare astros lado a lado',
      feature3Desc: 'Gráficos visuais pra comparar diâmetro, massa, gravidade e mais entre dois astros quaisquer.',
      formEyebrow: 'INSCRIÇÃO',
      labelName: 'Nome completo',
      labelAge: 'Idade',
      labelCountry: 'País',
      labelLanguage: 'Idioma preferido',
      placeholderLanguage: 'Português, English…',
      labelEmail: 'Conta do Google',
      googleSwitch: 'trocar de conta',
      errorGoogleRequired: 'Entra com sua conta do Google pra continuar.',
      labelBrand: 'Marca do celular',
      labelModel: 'Modelo do celular',
      placeholderModel: 'ex: Galaxy S23, Redmi Note 13',
      labelAndroid: 'Versão do Android',
      labelSocialText: 'Instagram / Discord',
      optOptional: '(opcional)',
      placeholderSocial: '@seu_usuario',
      submitBtn: 'Quero testar',
      submitting: 'Enviando…',
      footNote: 'Seus dados são usados só pra te convidar no teste fechado do Google Play.',
      credit: 'Astrovision AR · um aplicativo da Chrome Hypercube',
      successTitle: 'Inscrição recebida',
      successP1: 'Você entrou na lista do teste fechado do Astrovision AR.',
      successP2: 'Fique de olho no e-mail que você cadastrou — o convite do Google Play chega por lá.',
      countdownLabel: 'Início previsto do teste fechado',
      countdownDate: '1 de novembro',
      cdDays: 'DIAS', cdHours: 'HORAS', cdMins: 'MIN', cdSecs: 'SEG',
      androidOnlyNote: 'Por enquanto, o teste fechado é só pra Android.',
      errorRequired: 'Preenche os campos obrigatórios pra continuar.',
      notSure: 'Não sei',
      otherBrand: 'Outra',
      toggleLabel: 'EN'
    },
    en: {
      eyebrow: 'ASTROVISION AR · BETA PROGRAM',
      h1a: 'Help test ', h1b: ' before launch',
      pitch: 'We’re recruiting a small group for the Google Play closed test. You get access to the app before everyone else, and we get an outside eye to polish it before launch.',
      heroCtaLearnMore: 'Learn more',
      heroCta: 'I want to test',
      featuresTitle: 'About Astrovision AR',
      aboutCopy: 'Astrovision AR is a space-exploration app: rotate and inspect planets, moons, stars, galaxies, and black holes in 3D and augmented reality, backed by real astronomical data. Compare celestial bodies side by side and dive into the Astronomical Library to learn more about each one.',
      feature1Title: 'Inspect in 3D',
      feature1Desc: 'Rotate, zoom, and see real data — temperature, diameter, atmospheric composition — for every planet, moon, star, and galaxy.',
      feature2Title: 'Astronomical Library',
      feature2Desc: 'Full, curated write-ups on every celestial body, from our own Solar System to distant galaxies.',
      feature3Title: 'Compare bodies side by side',
      feature3Desc: 'Visual charts comparing diameter, mass, gravity, and more between any two celestial bodies.',
      formEyebrow: 'SIGN UP',
      labelName: 'Full name',
      labelAge: 'Age',
      labelCountry: 'Country',
      labelLanguage: 'Preferred language',
      placeholderLanguage: 'English, Português…',
      labelEmail: 'Google account',
      googleSwitch: 'switch account',
      errorGoogleRequired: 'Sign in with your Google account to continue.',
      labelBrand: 'Phone brand',
      labelModel: 'Phone model',
      placeholderModel: 'e.g. Galaxy S23, Pixel 8',
      labelAndroid: 'Android version',
      labelSocialText: 'Instagram / Discord',
      optOptional: '(optional)',
      placeholderSocial: '@your_handle',
      submitBtn: 'I want to test',
      submitting: 'Sending…',
      footNote: 'Your info is only used to invite you to the Google Play closed test.',
      credit: 'Astrovision AR · a Chrome Hypercube app',
      successTitle: 'Signup received',
      successP1: 'You’re on the list for the Astrovision AR closed test.',
      successP2: 'Keep an eye on the e-mail you signed up with — the Google Play invite lands there.',
      countdownLabel: 'Closed test expected to start',
      countdownDate: 'November 1st',
      cdDays: 'DAYS', cdHours: 'HOURS', cdMins: 'MIN', cdSecs: 'SEC',
      androidOnlyNote: 'For now, the closed test is Android-only.',
      errorRequired: 'Fill in the required fields to continue.',
      notSure: 'Not sure',
      otherBrand: 'Other',
      toggleLabel: 'PT'
    }
  };

  var currentLang = (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';

  function fillSelect(select, values, trailingKey, lang){
    select.innerHTML = '';
    values.forEach(function(v){
      var o = document.createElement('option');
      o.value = v; o.textContent = v;
      select.appendChild(o);
    });
    var trailing = document.createElement('option');
    trailing.value = STRINGS[lang][trailingKey];
    trailing.textContent = STRINGS[lang][trailingKey];
    select.appendChild(trailing);
  }

  function applyLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    var s = STRINGS[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(s[key] != null) el.textContent = s[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-placeholder');
      if(s[key] != null) el.placeholder = s[key];
    });
    document.getElementById('lang-toggle').textContent = s.toggleLabel;
    document.getElementById('banner-img').src = lang === 'pt' ? 'screenshots/banner-pt.jpg' : 'screenshots/banner-en.jpg';

    var brandSel = document.getElementById('f-brand');
    var prevBrand = brandSel.value;
    fillSelect(brandSel, BRANDS, 'otherBrand', lang);
    if(prevBrand) brandSel.value = prevBrand;

    var androidSel = document.getElementById('f-android');
    var prevAndroid = androidSel.value;
    fillSelect(androidSel, ANDROID_VERSIONS, 'notSure', lang);
    if(prevAndroid) androidSel.value = prevAndroid;
  }

  document.getElementById('lang-toggle').addEventListener('click', function(){
    applyLang(currentLang === 'pt' ? 'en' : 'pt');
  });

  applyLang(currentLang);

  function decodeJwtPayload(token){
    var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    var json = decodeURIComponent(atob(base64).split('').map(function(c){
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(json);
  }

  var GOOGLE_AUTOFILL_IDS = ['f-name'];

  function fillAndLock(fieldId, value){
    var el = document.getElementById(fieldId);
    if(el && !el.value && value){
      el.value = value;
      el.readOnly = true;
    }
  }

  function handleGoogleCredential(response){
    var payload;
    try{ payload = decodeJwtPayload(response.credential); }
    catch(e){ return; }
    if(!payload || !payload.email) return;

    document.getElementById('f-email').value = payload.email;
    document.getElementById('google-email-display').textContent = payload.email;
    document.getElementById('google-signin-btn').hidden = true;
    document.getElementById('google-signed-in').hidden = false;

    fillAndLock('f-name', payload.name);
  }

  function initGoogleSignIn(){
    if(!window.google || !window.google.accounts || !window.google.accounts.id) return;
    google.accounts.id.initialize({
      client_id: '394997597989-ld5v35n0oq1nqi2a46n4d34msnm533fg.apps.googleusercontent.com',
      callback: handleGoogleCredential
    });
    var btnContainer = document.getElementById('google-signin-btn');
    var btnWidth = Math.max(200, Math.min(280, (btnContainer.clientWidth || 280) - 8));
    google.accounts.id.renderButton(btnContainer, {
      theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin', width: btnWidth
    });
  }

  if(window.google && window.google.accounts){
    initGoogleSignIn();
  } else {
    window.addEventListener('load', initGoogleSignIn);
  }

  document.getElementById('google-switch-account').addEventListener('click', function(){
    document.getElementById('f-email').value = '';
    document.getElementById('google-signed-in').hidden = true;
    document.getElementById('google-signin-btn').hidden = false;
    GOOGLE_AUTOFILL_IDS.forEach(function(id){
      var el = document.getElementById(id);
      if(el && el.readOnly){
        el.value = '';
        el.readOnly = false;
      }
    });
    if(window.google && window.google.accounts && window.google.accounts.id){
      google.accounts.id.disableAutoSelect();
    }
  });

  var form = document.getElementById('signup-form');
  var submitBtn = document.getElementById('submit-btn');
  var errorMsg = document.getElementById('error-msg');
  var formSubmitted = false;

  form.addEventListener('submit', function(e){
    if(!form.checkValidity()){
      e.preventDefault();
      errorMsg.textContent = STRINGS[currentLang].errorRequired;
      return;
    }
    if(!document.getElementById('f-email').value){
      e.preventDefault();
      errorMsg.textContent = STRINGS[currentLang].errorGoogleRequired;
      return;
    }
    errorMsg.textContent = '';
    formSubmitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = STRINGS[currentLang].submitting;
    // native submit proceeds to the hidden iframe from here
  });

  var BETA_START = new Date('2026-11-01T00:00:00-03:00').getTime();
  var countdownInterval = null;
  function startCountdown(){
    var elD = document.getElementById('cd-days');
    var elH = document.getElementById('cd-hours');
    var elM = document.getElementById('cd-mins');
    var elS = document.getElementById('cd-secs');
    function pad(n){ return String(n).padStart(2, '0'); }
    function tick(){
      var diff = BETA_START - Date.now();
      if(diff <= 0){
        elD.textContent = elH.textContent = elM.textContent = elS.textContent = '00';
        clearInterval(countdownInterval);
        return;
      }
      elD.textContent = pad(Math.floor(diff / 86400000));
      elH.textContent = pad(Math.floor(diff % 86400000 / 3600000));
      elM.textContent = pad(Math.floor(diff % 3600000 / 60000));
      elS.textContent = pad(Math.floor(diff % 60000 / 1000));
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  document.getElementById('hidden_iframe').addEventListener('load', function(){
    if(!formSubmitted) return;
    form.hidden = true;
    document.getElementById('success-email').textContent = document.getElementById('f-email').value;
    document.getElementById('success-panel').hidden = false;
    startCountdown();
  });

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.hidden = false;
  }
  function closeLightbox(){
    lightbox.hidden = true;
    lightboxImg.src = '';
  }

  document.querySelectorAll('.feature img').forEach(function(img){
    img.addEventListener('click', function(){ openLightbox(img.src, img.alt); });
  });
  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox) closeLightbox();
  });
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !lightbox.hidden) closeLightbox();
  });
})();
</script>
