<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrovision AR — Programa Beta</title>
<meta name="description" content="Inscreva-se pro teste fechado do Astrovision AR, um jogo da Chrome Hypercube.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#070a13;
  --panel:rgba(18,24,38,0.72);
  --panel-border:rgba(112,214,224,0.28);
  --text:#eaf3f7;
  --text-soft:#93a7b8;
  --cyan:#52e3e8;
  --cyan-dim:rgba(82,227,232,0.15);
  --warm:#ff9a4d;
  --success:#7be08a;
  --danger:#ff8a7a;
  --field-bg:rgba(255,255,255,0.04);
  --field-border:rgba(147,167,184,0.28);
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  position:relative;
  overflow-x:hidden;
  font-family:'Manrope', system-ui, sans-serif;
}
img{max-width:100%;}
.stars{
  position:fixed; inset:-20% -20% -20% -20%; z-index:0; pointer-events:none;
  background-repeat:repeat;
  opacity:.7;
}
.stars-far{
  background-image:
    radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 33% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 65% 15%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 30% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 95% 85%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 48% 92%, rgba(255,255,255,.45), transparent);
  background-size:420px 420px;
  animation:drift-far 90s linear infinite;
}
.stars-mid{
  background-image:
    radial-gradient(1.3px 1.3px at 15% 45%, rgba(255,255,255,.75), transparent),
    radial-gradient(1.2px 1.2px at 38% 18%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.3px 1.3px at 58% 70%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.2px 1.2px at 78% 32%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.3px 1.3px at 92% 78%, rgba(255,255,255,.65), transparent),
    radial-gradient(1.2px 1.2px at 25% 88%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.3px 1.3px at 68% 5%, rgba(255,255,255,.6), transparent);
  background-size:380px 380px;
  animation:drift-mid 55s linear infinite;
}
.stars-near{
  background-image:
    radial-gradient(1.8px 1.8px at 12% 22%, rgba(255,255,255,.95), transparent),
    radial-gradient(1.5px 1.5px at 72% 8%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.8px 1.8px at 88% 68%, rgba(255,255,255,.9), transparent),
    radial-gradient(1.5px 1.5px at 45% 82%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.8px 1.8px at 5% 55%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.5px 1.5px at 60% 35%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.6px 1.6px at 30% 60%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.5px 1.5px at 82% 20%, rgba(255,255,255,.75), transparent);
  background-size:320px 320px;
  animation:drift-near 32s linear infinite, twinkle 4.5s ease-in-out infinite;
}
@keyframes drift-far{ from{transform:translate3d(0,0,0);} to{transform:translate3d(-420px,420px,0);} }
@keyframes drift-mid{ from{transform:translate3d(0,0,0);} to{transform:translate3d(380px,-380px,0);} }
@keyframes drift-near{ from{transform:translate3d(0,0,0);} to{transform:translate3d(-320px,-320px,0);} }
@keyframes twinkle{ 0%,100%{opacity:.85;} 50%{opacity:.45;} }
.shooting-star{
  position:fixed; z-index:0; pointer-events:none;
  width:140px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9) 70%, #fff);
  opacity:0;
  transform:translate3d(0,0,0) rotate(45deg);
  animation:shoot 6s cubic-bezier(.2,.6,.3,1) infinite;
}
.shooting-star.s2{ animation-delay:2.1s; animation-duration:7.5s; }
.shooting-star.s3{ animation-delay:4.4s; animation-duration:5.2s; }
@keyframes shoot{
  /* translate uses vmin on both axes (not vw/vh) so the path is a true
     45-degree diagonal in real pixels no matter the screen's aspect ratio —
     mixing vw/vh made the streak's fixed rotation not match its own travel
     direction on narrow phone screens. translate comes before rotate in
     each transform so the diagonal is measured in real screen space, then
     the bar is spun 45° in place to line up with it. */
  0%{ transform:translate3d(-15vmin,-15vmin,0) rotate(45deg); opacity:0; }
  4%{ opacity:1; }
  22%{ transform:translate3d(75vmin,75vmin,0) rotate(45deg); opacity:0; }
  100%{ transform:translate3d(75vmin,75vmin,0) rotate(45deg); opacity:0; }
}
@media (prefers-reduced-motion: reduce){
  .stars-far, .stars-mid, .stars-near, .shooting-star{animation:none; opacity:0;}
}
.nebula{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(600px 420px at 12% -8%, rgba(82,227,232,0.16), transparent 60%),
    radial-gradient(560px 460px at 105% 15%, rgba(255,154,77,0.13), transparent 60%),
    radial-gradient(700px 500px at 50% 115%, rgba(82,227,232,0.10), transparent 60%);
}
.wrap{
  position:relative; z-index:1;
  min-height:100%;
  display:flex; align-items:center; justify-content:center;
  padding:40px 16px 56px;
}
.card{
  width:100%; max-width:480px;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:18px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(82,227,232,0.05), 0 30px 80px -30px rgba(0,0,0,0.6), 0 0 60px -20px rgba(82,227,232,0.15);
  padding:30px 26px 26px;
  position:relative;
}
.corner-tl, .corner-tr, .corner-bl, .corner-br{
  content:""; position:absolute; width:16px; height:16px;
  border-color:var(--cyan); opacity:.65;
}
.corner-tl{top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; border-top-left-radius:8px;}
.corner-tr{top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; border-top-right-radius:8px;}
.corner-bl{bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; border-bottom-left-radius:8px;}
.corner-br{bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; border-bottom-right-radius:8px;}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--cyan);
  display:flex; align-items:center; gap:8px;
}
.eyebrow .dot{
  width:6px; height:6px; border-radius:50%; background:var(--cyan);
  box-shadow:0 0 8px 1px var(--cyan);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.4;} 50%{opacity:1;} }
@media (prefers-reduced-motion: reduce){ .eyebrow .dot{animation:none;} }
.lang-toggle{
  flex-shrink:0;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; font-weight:600; letter-spacing:.04em;
  color:var(--cyan);
  background:var(--cyan-dim);
  border:1px solid var(--panel-border);
  border-radius:99px;
  padding:5px 11px;
  cursor:pointer;
}
h1{
  font-family:'Rajdhani', system-ui, sans-serif;
  font-weight:700;
  font-size:clamp(26px,6vw,32px);
  letter-spacing:.01em;
  line-height:1.08;
  margin:0 0 10px;
  text-wrap:balance;
}
h1 .accent{color:var(--cyan);}
.gradient-rule{
  height:2px; width:64px; border-radius:2px; margin-bottom:16px;
  background:linear-gradient(90deg, var(--cyan), var(--warm));
}
.pitch{
  font-size:14px; line-height:1.6; color:var(--text-soft);
  margin:0 0 22px;
}
.pitch strong{color:var(--text); font-weight:600;}
.field{margin-bottom:14px;}
.field label{
  display:block; font-size:11.5px; font-weight:600;
  letter-spacing:.03em; text-transform:uppercase;
  color:var(--text-soft); margin-bottom:6px;
}
.field .opt{font-weight:400; text-transform:none; letter-spacing:0; font-size:11px; opacity:.7;}
.field input, .field select{
  width:100%;
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  color:var(--text);
  background:var(--field-bg);
  border:1px solid var(--field-border);
  border-radius:9px;
  padding:11px 12px;
}
.field select{ appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2393a7b8'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%2393a7b8' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center; padding-right:32px;
}
.field select option{ color:#0e1720; }
.field input::placeholder{color:var(--text-soft); opacity:.7; font-family:'Manrope',sans-serif;}
.field input:focus, .field select:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim);}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.submit-btn{
  width:100%; margin-top:6px;
  font-family:'Rajdhani', sans-serif;
  font-weight:700; font-size:16px; letter-spacing:.03em;
  text-transform:uppercase;
  color:#05171a;
  background:linear-gradient(90deg, var(--cyan), #8ff0f3);
  border:none; border-radius:10px;
  padding:13px 16px;
  cursor:pointer;
  box-shadow:0 8px 24px -10px rgba(82,227,232,0.55);
}
.submit-btn:disabled{opacity:.55; cursor:default;}
.submit-btn:active:not(:disabled){transform:translateY(1px);}
.error-msg{font-size:12.5px; color:var(--danger); margin-top:10px; min-height:1em;}
.foot-row{
  margin-top:18px; padding-top:16px;
  border-top:1px solid var(--panel-border);
  text-align:center;
}
.foot-note{font-size:11.5px; color:var(--text-soft); line-height:1.5;}
.credit{
  margin-top:16px;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px; letter-spacing:.03em;
  color:var(--text-soft); opacity:.6;
  text-align:center;
}
.success{text-align:center; padding:18px 4px 6px;}
.success .ring{
  width:56px; height:56px; margin:0 auto 16px;
  border-radius:50%;
  border:2px solid var(--success);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 24px -4px var(--success);
}
.success .ring svg{width:24px;height:24px;stroke:var(--success);}
.success h2{font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px; margin:0 0 8px;}
.success p{font-size:13.5px; color:var(--text-soft); line-height:1.6; margin:0 0 4px;}
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="stars stars-far"></div>
<div class="stars stars-mid"></div>
<div class="stars stars-near"></div>
<div class="shooting-star" style="top:8%; left:5%;"></div>
<div class="shooting-star s2" style="top:22%; left:40%;"></div>
<div class="shooting-star s3" style="top:2%; left:65%;"></div>
<div class="nebula"></div>
<div class="wrap">
  <div class="card">
    <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>

    <div class="top-row">
      <div class="eyebrow"><span class="dot"></span><span data-i18n="eyebrow"></span></div>
      <button type="button" class="lang-toggle" id="lang-toggle">EN</button>
    </div>

    <h1><span data-i18n="h1a"></span><span class="accent">Astrovision AR</span><span data-i18n="h1b"></span></h1>
    <div class="gradient-rule"></div>
    <p class="pitch" data-i18n="pitch"></p>

    <form id="signup-form"
          action="https://docs.google.com/forms/d/e/1FAIpQLSft5EhdXIyrzVyPZEPf47ThdUMaXpWvh4GPfqWQzRxSLZj9cQ/formResponse"
          method="POST" target="hidden_iframe" novalidate>

      <div class="field"><label data-i18n="labelName" for="f-name"></label>
        <input id="f-name" name="entry.830039424" type="text" required autocomplete="name"></div>

      <div class="row-2">
        <div class="field"><label data-i18n="labelAge" for="f-age"></label>
          <input id="f-age" name="entry.108445625" type="number" min="8" max="99" required></div>
        <div class="field"><label data-i18n="labelCountry" for="f-country"></label>
          <input id="f-country" name="entry.2102280177" type="text" required autocomplete="country-name"></div>
      </div>

      <div class="field"><label data-i18n="labelLanguage" for="f-lang"></label>
        <input id="f-lang" name="entry.1188727805" type="text" required data-i18n-placeholder="placeholderLanguage"></div>

      <div class="field"><label data-i18n="labelEmail" for="f-email"></label>
        <input id="f-email" name="entry.567471931" type="email" required autocomplete="email"></div>

      <div class="field"><label data-i18n="labelBrand" for="f-brand"></label>
        <select id="f-brand" name="entry.924664508" required></select></div>

      <div class="field"><label data-i18n="labelModel" for="f-model"></label>
        <input id="f-model" name="entry.1044148243" type="text" required data-i18n-placeholder="placeholderModel"></div>

      <div class="field"><label data-i18n="labelAndroid" for="f-android"></label>
        <select id="f-android" name="entry.256874408"></select></div>

      <div class="field"><label data-i18n="labelSocialText" for="f-social"></label>
        <input id="f-social" name="entry.179313469" type="text" required data-i18n-placeholder="placeholderSocial"></div>

      <button type="submit" class="submit-btn" id="submit-btn" data-i18n="submitBtn"></button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="success" id="success-panel" hidden>
      <div class="ring"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 data-i18n="successTitle"></h2>
      <p data-i18n="successP1"></p>
      <p data-i18n="successP2"></p>
    </div>

    <div class="foot-row">
      <div class="foot-note" data-i18n="footNote"></div>
    </div>
    <div class="credit" data-i18n="credit"></div>
  </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
(function(){
  var BRANDS = ["Samsung","Xiaomi, Redmi ou POCO","Motorola","Google Pixel","Asus","Realme","OnePlus","Multilaser","LG","Sony","Nokia","TCL","Lenovo","Infinix"];
  var ANDROID_VERSIONS = ["Android 16","Android 15","Android 14","Android 13","Android 12","Android 11","Android 10","Android 9","Android 8","Android 7"];

  var STRINGS = {
    pt: {
      eyebrow: 'ASTROVISION AR · PROGRAMA BETA',
      h1a: 'Ajude a testar o ', h1b: ' antes do lançamento',
      pitch: 'Estamos recrutando um grupo pequeno pra o teste fechado no Google Play. Preencha a inscrição abaixo — avisamos por e-mail assim que o convite estiver pronto.',
      labelName: 'Nome completo',
      labelAge: 'Idade',
      labelCountry: 'País',
      labelLanguage: 'Idioma preferido',
      placeholderLanguage: 'Português, English…',
      labelEmail: 'E-mail do Google Play',
      labelBrand: 'Marca do celular',
      labelModel: 'Modelo do celular',
      placeholderModel: 'ex: Galaxy S23, Redmi Note 13',
      labelAndroid: 'Versão do Android',
      labelSocialText: 'Instagram / Discord',
      optOptional: '(opcional)',
      placeholderSocial: '@seu_usuario',
      submitBtn: 'Quero testar',
      submitting: 'Enviando…',
      footNote: 'Seus dados são usados só pra te convidar no teste fechado do Google Play.',
      credit: 'Astrovision AR · um jogo da Chrome Hypercube',
      successTitle: 'Inscrição recebida',
      successP1: 'Você entrou na lista do teste fechado do Astrovision AR.',
      successP2: 'Fique de olho no e-mail que você cadastrou — o convite do Google Play chega por lá.',
      errorRequired: 'Preenche os campos obrigatórios pra continuar.',
      notSure: 'Não sei',
      otherBrand: 'Outra',
      toggleLabel: 'EN'
    },
    en: {
      eyebrow: 'ASTROVISION AR · BETA PROGRAM',
      h1a: 'Help test ', h1b: ' before launch',
      pitch: 'We’re recruiting a small group for the Google Play closed test. Fill in the form below — we’ll email you once your invite is ready.',
      labelName: 'Full name',
      labelAge: 'Age',
      labelCountry: 'Country',
      labelLanguage: 'Preferred language',
      placeholderLanguage: 'English, Português…',
      labelEmail: 'Google Play e-mail',
      labelBrand: 'Phone brand',
      labelModel: 'Phone model',
      placeholderModel: 'e.g. Galaxy S23, Pixel 8',
      labelAndroid: 'Android version',
      labelSocialText: 'Instagram / Discord',
      optOptional: '(optional)',
      placeholderSocial: '@your_handle',
      submitBtn: 'I want to test',
      submitting: 'Sending…',
      footNote: 'Your info is only used to invite you to the Google Play closed test.',
      credit: 'Astrovision AR · a Chrome Hypercube game',
      successTitle: 'Signup received',
      successP1: 'You’re on the list for the Astrovision AR closed test.',
      successP2: 'Keep an eye on the e-mail you signed up with — the Google Play invite lands there.',
      errorRequired: 'Fill in the required fields to continue.',
      notSure: 'Not sure',
      otherBrand: 'Other',
      toggleLabel: 'PT'
    }
  };

  var currentLang = (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';

  function fillSelect(select, values, trailingKey, lang){
    select.innerHTML = '';
    values.forEach(function(v){
      var o = document.createElement('option');
      o.value = v; o.textContent = v;
      select.appendChild(o);
    });
    var trailing = document.createElement('option');
    trailing.value = STRINGS[lang][trailingKey];
    trailing.textContent = STRINGS[lang][trailingKey];
    select.appendChild(trailing);
  }

  function applyLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    var s = STRINGS[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(s[key] != null) el.textContent = s[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-placeholder');
      if(s[key] != null) el.placeholder = s[key];
    });
    document.getElementById('lang-toggle').textContent = s.toggleLabel;

    var brandSel = document.getElementById('f-brand');
    var prevBrand = brandSel.value;
    fillSelect(brandSel, BRANDS, 'otherBrand', lang);
    if(prevBrand) brandSel.value = prevBrand;

    var androidSel = document.getElementById('f-android');
    var prevAndroid = androidSel.value;
    fillSelect(androidSel, ANDROID_VERSIONS, 'notSure', lang);
    if(prevAndroid) androidSel.value = prevAndroid;
  }

  document.getElementById('lang-toggle').addEventListener('click', function(){
    applyLang(currentLang === 'pt' ? 'en' : 'pt');
  });

  applyLang(currentLang);

  var form = document.getElementById('signup-form');
  var submitBtn = document.getElementById('submit-btn');
  var errorMsg = document.getElementById('error-msg');
  var formSubmitted = false;

  form.addEventListener('submit', function(e){
    if(!form.checkValidity()){
      e.preventDefault();
      errorMsg.textContent = STRINGS[currentLang].errorRequired;
      return;
    }
    errorMsg.textContent = '';
    formSubmitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = STRINGS[currentLang].submitting;
    // native submit proceeds to the hidden iframe from here
  });

  document.getElementById('hidden_iframe').addEventListener('load', function(){
    if(!formSubmitted) return;
    form.hidden = true;
    document.getElementById('success-panel').hidden = false;
  });
})();
</script>
</body>
</html>
